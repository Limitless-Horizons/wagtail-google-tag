# See https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# for a detailed guide
name: Publish to PyPI

on:
  release:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#release
    types: [published]
  # Test and build, without publishing, when a pull request changes how the
  # package is built or released.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - .github/workflows/test.yml
      - .github/scripts/check_package.py
      - pyproject.toml

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
  build:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # Prevent cache poisoning by disabling cache.
        with:
          enable-cache: false
      - run: uv build --verbose
      # Smoke test each ready-to-publish package on its own: it installs,
      # and carries its templates, static files and migrations.
      - run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" python .github/scripts/check_package.py
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ./dist
  # On pull requests, download the packages exactly as the publish job does,
  # and run the publish action's own metadata check on them.
  check-download:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        # Prevent cache poisoning by disabling cache.
        with:
          enable-cache: false
      - run: |
          ls -l dist/
          ls dist/*.whl dist/*.tar.gz
          uvx twine check --strict dist/*
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: none
      id-token: write # required for trusted publishing
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
