[project]
name = "wagtail-google-tag"
version = "0.3.0"
description = "Google tag configuration UI (GA4) for Wagtail: per-site settings, Consent Mode defaults and click events, set up in the Wagtail admin."
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Limitless Horizons Development, LLC" }]
classifiers = [
    # Update this based on your project's status.
    # See: https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
]
# See: https://devguide.python.org/versions/#supported-versions
requires-python = ">=3.11"
dependencies = [
    # https://www.djangoproject.com/download/#supported-versions
    "django>=5.2",
    # https://github.com/wagtail/wagtail/wiki/Release-schedule
    # https://docs.wagtail.org/en/latest/releases/upgrading.html#compatible-django-python-versions
    "wagtail>=7.4",
]

[project.urls]
Homepage = "https://github.com/Limitless-Horizons/wagtail-google-tag"
Repository = "https://github.com/Limitless-Horizons/wagtail-google-tag"
Changelog = "https://github.com/Limitless-Horizons/wagtail-google-tag/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Limitless-Horizons/wagtail-google-tag/blob/main/README.md"
Issues = "https://github.com/Limitless-Horizons/wagtail-google-tag/issues"
# Add funding link if needed.
# Funding = "https://github.com/Limitless-Horizons/wagtail-google-tag"

[dependency-groups]
dev = [
    "dj-database-url>=3.1.2",
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_google_tag"
source-exclude = [
    "wagtail_google_tag/static_src",
    "wagtail_google_tag/test",
    "testmanage.py",
    ".*",
    "prettier.config.js",
    "*.json",
    "*.ini",
    "*.yml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wagtail_google_tag.test.settings"
testpaths = ["tests"]
